{% load i18n %}
<button class="sticky toggle-nav-sidebar" id="toggle-nav-sidebar" aria-label="{% translate 'Toggle navigation' %}"></button>
<nav class="sticky" id="nav-sidebar" aria-label="{% translate 'Administration navigation' %}">
  <span class="retail-nav-label">{% translate "YOUR WORKSPACE" %}</span>
  <a class="retail-overview-link" href="{% url 'admin:index' %}"{% if request.resolver_match.url_name == 'index' %} aria-current="page"{% endif %}><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg> {% translate "Dashboard" %}</a>
  <input type="search" id="nav-filter" placeholder="{% translate 'Find a section…' %}" aria-label="{% translate 'Filter navigation items' %}">
  {% include 'admin/app_list.html' with app_list=available_apps show_changelinks=False %}
  <div class="retail-sidebar-profile"><span class="retail-avatar" aria-hidden="true">{{ user.get_username|first|upper }}</span><div><strong>{% firstof user.get_short_name user.get_username %}</strong><small>{% translate "Store administrator" %}</small></div></div>
</nav>
