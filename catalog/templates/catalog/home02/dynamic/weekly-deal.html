<div class="rtsb-col-grid rtsb-product product type-product {% if product.quantity %}instock{% else %}outofstock{% endif %} sale" data-id="live-{{ product.pk }}">
  <div class="rtsb-item-default rtsb-grid-item box-hover-shadow">
    <div class="rtsb-cat-meta-wrap">
      <div class="rtsb-single-cat"><a href="{% url 'home' %}?category={{ product.homepage_category.pk }}#rtsb-container-138192095" data-live-catalogue>{{ product.homepage_category.name }}</a></div>
      {% include 'catalog/home02/dynamic/trending-actions.html' with deal=True %}
    </div>
    <div class="rtsb-product-img">
      <figure><a href="#product-{{ product.pk }}" data-product-detail aria-label="View {{ product.name }}">
        {% with photo=product.photos.all.0 %}
        {% if photo %}<img src="{% url 'public-product-photo' photo.pk %}" class="rtsb-product-image" alt="{{ photo.alt_text|default:product.name }}" width="100" height="100" loading="lazy">
        {% else %}<span class="homepage-photo-placeholder"><i class="icon-zilly-cart" aria-hidden="true"></i><span>No photo available</span></span>{% endif %}
        {% endwith %}
      </a></figure>
    </div>
    <div class="rtsb-product-content">
      <div class="product-price"><div class="price-wrapper">{% include 'catalog/home02/dynamic/price.html' %}</div><span class="homepage-deal-discount">{{ product.discount_percentage }}% off</span></div>
      <div class="rtsb-product-title-wrapper"><h3 class="product-title rtsb-text-limit limit-2-line"><a href="#product-{{ product.pk }}" data-product-detail title="{{ product.name }}">{{ product.name }}</a></h3></div>
      <p class="homepage-stock">{% if product.quantity %}In stock{% else %}Out of stock{% endif %}</p>
    </div>
  </div>
</div>
