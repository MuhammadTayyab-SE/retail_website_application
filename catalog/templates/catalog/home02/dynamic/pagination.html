{% if page_obj.has_other_pages %}
<nav class="homepage-pagination" aria-label="Product pages">
  {% if page_obj.has_previous %}<a href="?q={{ query|urlencode }}&amp;category={{ selected|urlencode }}&amp;page={{ page_obj.previous_page_number }}#rtsb-container-138192095" data-live-catalogue>Previous</a>{% endif %}
  <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a href="?q={{ query|urlencode }}&amp;category={{ selected|urlencode }}&amp;page={{ page_obj.next_page_number }}#rtsb-container-138192095" data-live-catalogue>Next</a>{% endif %}
</nav>
{% endif %}
