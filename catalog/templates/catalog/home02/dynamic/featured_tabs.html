<div class="rtsb-tab-filters"><div class="rtsb-filter-item-wrap rtsb-tax-filter top-slider-nav type-button" data-taxonomy="product_cat">
  <a class="rtsb-filter-button-item {% if not selected %}selected{% endif %}" href="{% url 'home' %}?q={{ query|urlencode }}#rtsb-container-138192095" data-live-catalogue>All</a>
  {% for entry in featured_categories %}<a class="rtsb-filter-button-item {% if selected_category.pk == entry.category.pk %}selected{% endif %}" href="{% url 'home' %}?q={{ query|urlencode }}&amp;category={{ entry.category.pk }}#rtsb-container-138192095" data-live-catalogue>{{ entry.category.name }} <span class="rtsb-count">({{ entry.count }})</span></a>{% endfor %}
</div></div>
