{% for product in best_selling_products %}
<div class="rtsb-col-grid even-grid-item rtsb-product rtsb-product-list product type-product {% if product.quantity %}instock{% else %}outofstock{% endif %} {% if product.is_on_sale %}sale{% endif %}" data-id="live-{{ product.pk }}">
  <div class="rtsb-item-default rtsb-list-item">
    <div class="rtsb-product-img"><figure>
      <a href="{% url 'product-detail' product.pk %}" class="rtsb-img-link" data-product-page aria-label="View {{ product.name }}">
        {% with photo=product.photos.all.0 %}
        {% if photo %}<img src="{% url 'public-product-photo' photo.pk %}" class="rtsb-product-image" alt="{{ photo.alt_text|default:product.name }}" width="100" height="100" loading="lazy">
        {% else %}<span class="homepage-photo-placeholder"><i class="icon-zilly-cart" aria-hidden="true"></i><span>No photo available</span></span>{% endif %}
        {% endwith %}
      </a>
    </figure></div>
    <div class="rtsb-product-content">
      <div class="product-price rtsb-item-space-between"><div class="price-wrapper">{% include 'catalog/home02/dynamic/price.html' %}</div></div>
      <div class="rtsb-product-title-wrapper"><h3 class="product-title rtsb-text-limit limit-1-line"><a href="{% url 'product-detail' product.pk %}" data-product-page title="{{ product.name }}">{{ product.name }}</a></h3></div>
    </div>
  </div>
</div>
{% empty %}<p class="homepage-empty">No matching products are available.</p>{% endfor %}
