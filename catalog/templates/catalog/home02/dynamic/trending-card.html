<div class="rtsb-col-grid rtsb-product product type-product {% if product.is_on_sale %}sale{% endif %}" data-id="live-{{ product.pk }}">
  <div class="homepage-trending-card">
    <div class="homepage-trending-card-header">
      <a class="rtsb-single-cat" href="{% url 'home' %}?category={{ product.homepage_category.pk }}#rtsb-container-138192095" data-live-catalogue title="{{ product.homepage_category.name }}">{{ product.homepage_category.name }}</a>
      <a href="#" class="rtsb-wishlist-btn" title="Add to Wishlist" aria-label="Save {{ product.name }}"><i class="icon-zilly-wishlist" aria-hidden="true"></i></a>
    </div>
    <a href="#product-{{ product.pk }}" class="homepage-trending-card-image" data-product-detail aria-label="View {{ product.name }}">
      {% with photo=product.photos.all.0 %}
      {% if photo %}<img src="{% url 'public-product-photo' photo.pk %}" class="rtsb-product-image" alt="{{ photo.alt_text|default:product.name }}" width="100" height="100" loading="lazy">
      {% else %}<span class="homepage-photo-placeholder"><i class="icon-zilly-cart" aria-hidden="true"></i><span>No photo available</span></span>{% endif %}
      {% endwith %}
    </a>
    <div class="product-price rtsb-item-space-between">
      <div class="price-wrapper">
        {% include 'catalog/home02/dynamic/price.html' %}
        {% if product.is_on_sale %}<div class="rtsb-promotion"><ul class="rtsb-promotion-list"><li class="rtsb-promotion-list-item"><span class="rtsb-tag-fill angle-right">-{{ product.discount_percentage }}%</span></li></ul></div>{% endif %}
      </div>
    </div>
    <h3 class="product-title"><a href="#product-{{ product.pk }}" data-product-detail title="{{ product.name }}">{{ product.name }}</a></h3>
  </div>
</div>
