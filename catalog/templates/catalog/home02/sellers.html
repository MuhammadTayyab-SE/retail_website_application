{% load static %}
<section id="sellers" class="content-section">
<div class="section-title">
<h2>Top Seller Users</h2>
<a href="#contact">See More →</a>
</div>
<div class="seller-grid">{% for seller in sellers %}<article class="seller-card">
<img src="{% static seller.image %}" alt="{{ seller.name }}" loading="lazy" width="90" height="90">
<h3>{{ seller.name }}</h3>
<p class="rating">★★★★★</p>
<p>Grocery &amp; Everyday Essentials</p>
<button data-preview="{{ seller.name }}'s store">Visit Store →</button>
</article>{% endfor %}</div>
</section>
