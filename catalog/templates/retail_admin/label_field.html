<div class="label-field{% if field.name == 'tracking' or field.name == 'instructions' or field.name == 'return_address' %} label-field-wide{% endif %}{% if field.field.widget.input_type == 'checkbox' %} label-check{% endif %}"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{{ field.errors }}</div>
