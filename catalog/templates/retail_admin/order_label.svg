<svg xmlns="http://www.w3.org/2000/svg" width="800" height="{{ label_height }}" viewBox="0 0 800 {{ label_height }}" role="img" aria-label="{{ order.number }} delivery label">
<rect width="800" height="{{ label_height }}" fill="white"/><rect x="18" y="18" width="764" height="{{ label_height|add:'-36' }}" rx="12" fill="none" stroke="#172638" stroke-width="2"/>
<g font-family="Arial,sans-serif" fill="#172638"><text x="48" y="65" font-size="28" font-weight="bold">retail.</text><text x="48" y="102" font-size="22" font-weight="bold">{{ order.number }}</text><text x="48" y="137" font-size="16" fill="#047857">{% if order.delivery_method == 'pickup' %}STORE PICKUP{% else %}DELIVERY{% endif %} · {{ receipt.quantity }} items</text>{% for line in label_lines %}<text x="48" y="{{ line.y }}" font-size="20">{{ line.text }}</text>{% endfor %}<text x="48" y="{{ label_footer }}" font-size="18">Total: PKR {{ order.total|floatformat:2 }} · Payment: {{ receipt.payment_status }}</text></g></svg>
